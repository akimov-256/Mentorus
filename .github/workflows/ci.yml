name: Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  APP_NAME: appMentorus
  QT_VERSION: 6.10.0

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtimageformats
          cache: true

      - name: Install linuxdeployqt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Strip unused Qt SQL driver plugins
        run: |
          # Only the sqlite driver is used by Mentorus. The other driver plugins
          # (mimer, odbc, psql, etc.) pull in client libraries that aren't installed
          # on the runner, which makes linuxdeployqt's ldd check abort.
          find "$QT_ROOT_DIR/plugins/sqldrivers" -type f ! -name 'libqsqlite.so' -delete
          ls "$QT_ROOT_DIR/plugins/sqldrivers"

      - name: Create desktop entry and icon
        run: |
          cat > build/${{ env.APP_NAME }}.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Mentorus
          Comment=AI-powered study assistant
          Exec=${{ env.APP_NAME }}
          Icon=${{ env.APP_NAME }}
          Categories=Education;
          EOF
          cp assets/icons/home.png build/${{ env.APP_NAME }}.png

      - name: Download linuxdeployqt
        run: |
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      - name: Deploy (linuxdeployqt)
        run: |
          ./linuxdeployqt-continuous-x86_64.AppImage build/${{ env.APP_NAME }}.desktop -appimage
        env:
          QML_SOURCES_PATHS: qml

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux
          path: '*.AppImage'

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (Windows)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats
          tools: 'tools_ninja'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build --parallel

      - name: Deploy (windeployqt)
        shell: cmd
        run: |
          windeployqt.exe build\${{ env.APP_NAME }}.exe --qmldir qml

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build\* -DestinationPath ${{ env.APP_NAME }}-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: '*.zip'

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.AppImage
            dist/**/*.zip
